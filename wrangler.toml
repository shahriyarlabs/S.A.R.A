name = "s-a-r-a"
main = "src/index.ts"
compatibility_date = "2025-01-01"

[observability]
enabled = true

[vars]
CLAUDE_MODEL = "claude-haiku-5-5"
TIMEZONE = "Asia/Dhaka"
# নীরব সময় (২৪-ঘণ্টার ফরম্যাটে, যেমন রাত ১১টা = 23, সকাল ৭টা = 7)
QUIET_START_HOUR = "23"
QUIET_END_HOUR = "7"

# Cloudflare Cron Triggers (সবসময় UTC সময়ে চলে; ঢাকা = UTC+6)
# "0 2 * * *"    -> প্রতিদিন সকাল ৮:০০টা (ঢাকা)
# "0 15 * * *"   -> প্রতিদিন রাত ৯:০০টা (ঢাকা)
# "*/15 * * * *" -> প্রতি ১৫ মিনিটে ডেডলাইন রিমাইন্ডার চেক
[triggers]
crons = ["0 2 * * *", "0 15 * * *", "*/15 * * * *"]

# আপনার sara-db-র Database ID এখানে বসান
[[d1_databases]]
binding = "DB"
database_name = "sara-db"
database_id = "e5cf3014-a08c-4a75-b88f-935aeb5e5557"
